<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#fff"/><text x="600" y="60" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#111827">MCP의 세 가지 기본 기능</text><circle cx="250" cy="290" r="125" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="250" y="280" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#1e3a8a">Prompts</text><text x="250" y="320" text-anchor="middle" font-family="Arial" font-size="18" fill="#1e3a8a">업무 시작 양식</text><circle cx="600" cy="290" r="125" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="600" y="280" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#166534">Resources</text><text x="600" y="320" text-anchor="middle" font-family="Arial" font-size="18" fill="#166534">참고 자료</text><circle cx="950" cy="290" r="125" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/><text x="950" y="280" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#991b1b">Tools</text><text x="950" y="320" text-anchor="middle" font-family="Arial" font-size="18" fill="#991b1b">실행 행동</text><text x="600" y="520" text-anchor="middle" font-family="Arial" font-size="22" fill="#334155">읽기와 실행을 섞지 말고, 각 기능의 통제 주체와 위험도를 표시한다</text></svg>
