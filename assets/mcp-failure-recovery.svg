<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#fff"/><text x="600" y="58" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#111827">실패 후의 안전한 분기</text><rect x="450" y="170" width="300" height="100" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="600" y="230" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1e3a8a">요청 실행</text><path d="M600 270V330M600 330H220M600 330H600M600 330H980" stroke="#64748b" stroke-width="4"/><rect x="80" y="360" width="280" height="100" rx="16" fill="#dcfce7"/><text x="220" y="420" text-anchor="middle" font-family="Arial" font-size="22" fill="#166534">성공 · 결과 기록</text><rect x="460" y="360" width="280" height="100" rx="16" fill="#fef3c7"/><text x="600" y="420" text-anchor="middle" font-family="Arial" font-size="22" fill="#92400e">일시 오류 · 재시도</text><rect x="840" y="360" width="280" height="100" rx="16" fill="#fee2e2"/><text x="980" y="420" text-anchor="middle" font-family="Arial" font-size="22" fill="#991b1b">상태 불명 · 보류</text><text x="600" y="540" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">상태 변경 작업은 재시도 전에 원본 시스템을 다시 확인한다</text></svg>
