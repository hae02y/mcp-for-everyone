<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#fff"/><text x="600" y="58" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#111827">신뢰할 수 없는 입력을 막는 네 겹의 방어</text><rect x="100" y="190" width="210" height="130" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="205" y="245" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#991b1b">외부 자료</text><text x="205" y="280" text-anchor="middle" font-family="Arial" font-size="17" fill="#991b1b">문서·메일·웹</text><rect x="370" y="190" width="210" height="130" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="475" y="245" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#92400e">범위 제한</text><text x="475" y="280" text-anchor="middle" font-family="Arial" font-size="17" fill="#92400e">필요한 기능만</text><rect x="640" y="190" width="210" height="130" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="745" y="245" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#166534">입력 검증</text><text x="745" y="280" text-anchor="middle" font-family="Arial" font-size="17" fill="#166534">형식·권한 확인</text><rect x="910" y="190" width="210" height="130" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="1015" y="245" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#1e3a8a">승인·감시</text><text x="1015" y="280" text-anchor="middle" font-family="Arial" font-size="17" fill="#1e3a8a">사람·로그</text><path d="M310 255h60M580 255h60M850 255h60" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><text x="600" y="475" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">외부 텍스트는 참고 자료이지 시스템 명령이 아니다</text></svg>
