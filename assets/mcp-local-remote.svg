<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#f8fafc"/><text x="600" y="58" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#0f172a">로컬 MCP와 원격 MCP</text><rect x="100" y="150" width="430" height="300" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><rect x="670" y="150" width="430" height="300" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="315" y="210" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#1e3a8a">로컬</text><text x="315" y="255" text-anchor="middle" font-family="Arial" font-size="19" fill="#1e3a8a">내 컴퓨터·사내 서버</text><text x="315" y="315" text-anchor="middle" font-family="Arial" font-size="18" fill="#334155">데이터 이동 적음</text><text x="315" y="350" text-anchor="middle" font-family="Arial" font-size="18" fill="#334155">설치·업데이트 직접 관리</text><text x="885" y="210" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#166534">원격</text><text x="885" y="255" text-anchor="middle" font-family="Arial" font-size="19" fill="#166534">중앙·외부 서버</text><text x="885" y="315" text-anchor="middle" font-family="Arial" font-size="18" fill="#334155">여러 사용자가 공유</text><text x="885" y="350" text-anchor="middle" font-family="Arial" font-size="18" fill="#334155">네트워크·인증 의존</text><text x="600" y="535" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">데이터 민감도와 운영 역량을 함께 보고 선택한다</text></svg>
